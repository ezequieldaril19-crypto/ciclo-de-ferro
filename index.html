  $("#sDays").onchange = e => { S.days = +e.target.value; S.program = recommendProgram(S.days, S.level); touchSettings(); render(); };
  $("#sLvl").onchange = e => { S.level = e.target.value; S.program = recommendProgram(S.days, S.level); touchSettings(); render(); };
  view.querySelectorAll("[data-prog]").forEach(b => b.onclick = () => { S.program = b.dataset.prog; touchSettings(); render(); toast(PROGRAMS[S.program].name); });

  if (typeof bindPwaPanel === "function") bindPwaPanel();
  $("#exp").onclick = async () => {
    const data = JSON.stringify({app:"ciclo-de-ferro", v:1, exported:new Date().toISOString(), S, M});
    if (typeof pwaExport === "function"){ await pwaExport(data); return; }
    try{
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl){ await dl.save({filename:`ciclo-de-ferro-${todayKey()}.json`, data}); toast("Backup salvo"); return; }
    }catch(e){ if (e && e.code === "declined") return; }
    $("#expOut").hidden = false; $("#expTxt").value = data; $("#expTxt").select();
  };
  $("#imp").onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (d.app !== "ciclo-de-ferro" || !d.S || !d.M) throw 0;
        S = mergeSettings(d.S); M = d.M;
        const now = Date.now(); S.t = now; Object.values(M).forEach(m => m.t = now);
        markDirty("settings"); Object.keys(M).forEach(mk => markDirty("m-"+mk));
        toast("Backup importado"); render();
      }catch(_){ toast("Esse arquivo não é um backup do Ciclo de Ferro"); }
    };
    rd.readAsText(file);
  };
  $("#wipe").onclick = () => { $("#wipeConfirm").hidden = false; };
  $("#wipeNo").onclick = () => { $("#wipeConfirm").hidden = true; };
  $("#wipeYes").onclick = async () => {
    const months = Object.keys(M);
    S = DEFAULT_SETTINGS(); M = {}; saveLocal();
    if (Cloud.ready){ try{ await Cloud.col.doc("settings").delete(); for (const mk of months) await Cloud.col.doc("m-"+mk).delete(); }catch(e){} }
    Cloud.dirty.clear(); ui.tab = "hoje"; render(); toast("Dados apagados");
  };
}

/* ================= Configuração inicial ================= */
function openSetup(){
  openSheet(`${sheetHead("Seu perfil")}
    <p class="note" style="margin:0">Com isso o app calcula seu gasto, a meta de cada tipo de dia e indica um programa de treino.</p>
    <div class="grid2">
      <div class="field"><label for="uSex">Sexo</label><select id="uSex"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>
      <div class="field"><label for="uAge">Idade</label><input id="uAge" type="number" inputmode="numeric" value="${S.age}"></div>
      <div class="field"><label for="uH">Altura (cm)</label><input id="uH" type="number" inputmode="numeric" value="${S.height}"></div>
      <div class="field"><label for="uW">Peso hoje (kg)</label><input id="uW" type="text" inputmode="decimal" placeholder="Ex.: 80,5"></div>
      <div class="field"><label for="uGoal">Objetivo</label><select id="uGoal"><option value="cut">Cutting</option><option value="keep">Manutenção</option><option value="bulk">Bulking limpo</option></select></div>
      <div class="field"><label for="uDays">Treinos por semana</label><select id="uDays">${[2,3,4,5,6].map(v => `<option ${v===3?"selected":""}>${v}</option>`).join("")}</select></div>
      <div class="field" style="grid-column:1/-1"><label for="uLvl">Experiência no treino</label><select id="uLvl"><option value="ini">Iniciante (menos de 1 ano)</option><option value="int">Intermediário (1 a 3 anos)</option><option value="avc">Avançado (mais de 3 anos)</option></select></div>
    </div>
    <button class="btn wide" id="uOk">Calcular minhas metas</button>`);
  $("#uOk").onclick = () => {
    const w = num($("#uW").value), a = num($("#uAge").value), h = num($("#uH").value);
    if (!w || !a || !h){ toast("Preencha idade, altura e peso"); return; }
    Object.assign(S, {sex:$("#uSex").value, age:Math.round(a), height:h, weight:r1(w), goal:$("#uGoal").value, days:+$("#uDays").value, level:$("#uLvl").value, setup:true});
    S.act = S.days >= 5 ? 1.725 : S.days >= 3 ? 1.55 : 1.375;
    S.program = recommendProgram(S.days, S.level);
    const dd = getDay(todayKey(), true); dd.w = r1(w); touchDay(todayKey());
    touchSettings(); closeSheet(); render(); toast("Metas calculadas");
  };
}

/* ================= Toast ================= */
let toastT;
function toast(msg){
  let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200);
}

/* ================= Início ================= */
/* ===== Versão instalável: offline, instalação, backup em arquivo, atualização ===== */
const APP_BUILD = "09/10/2026 23:42";
if ("serviceWorker" in navigator){
  let hadController = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // procura versão nova sempre que o app volta para a tela
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController){ hadController = true; return; }
    showUpdateBar();
  });
}
function showUpdateBar(){
  if (document.getElementById("updBar")) return;
  const bar = document.createElement("div");
  bar.id = "updBar"; bar.setAttribute("role", "status");
  bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--blue);color:#02060f;font-weight:700;max-width:496px;margin:0 auto;clip-path:polygon(1% 0,100% 6%,99% 100%,0 92%)";
  bar.innerHTML = `<span style="flex:1">Nova versão do app pronta.</span><button style="background:#02060f;color:var(--ink);border:0;padding:8px 14px;font-family:var(--f-impact);letter-spacing:.06em;text-transform:uppercase">Atualizar</button>`;
  bar.querySelector("button").onclick = () => location.reload();
  document.body.appendChild(bar);
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (ui.tab === "ajustes") render(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("App instalado"); if (ui.tab === "ajustes") render(); });
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function hasData(){ return Object.keys(M).length > 0; }
function daysSinceBackup(){ return S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : null; }
function backupBanner(){
  if (!hasData()) return "";
  const d = daysSinceBackup();
  if (d !== null && d < 7) return "";
  return `<section class="panel blue" style="margin-bottom:12px"><div class="row"><p class="grow" style="margin:0;font-size:14px">${d === null ? "Você ainda não fez backup." : `Último backup há ${d} dias.`} Seus registros ficam só neste celular.</p><button class="add" id="bkNow">Fazer</button></div></section>`;
}
function pwaPanel(){
  if (isStandalone()) return "";
  let body;
  if (installEvt) body = `<p class="note" style="margin:0 0 10px">Instale para abrir em tela cheia, com ícone próprio e funcionando sem internet.</p><button class="btn wide" id="pwaInstall">Instalar o app</button>`;
  else if (isIOS()) body = `<p class="note" style="margin:0">No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>.</p>`;
  else body = `<p class="note" style="margin:0">No Chrome, abra o menu <b>⋮</b> e toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>`;
  return `<h2 class="sec b"><span class="t">Instalar no celular</span></h2><section class="panel">${body}</section>`;
}
function bindPwaPanel(){
  const b = document.getElementById("pwaInstall");
  if (b) b.onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); };
  const d = daysSinceBackup();
  const note = document.querySelector("#dataSec + section .note");
  if (note) note.textContent = `Seus registros ficam salvos só neste celular. ${d === null ? "Você ainda não fez nenhum backup." : `Último backup: há ${d} ${d === 1 ? "dia" : "dias"}.`} Exporte toda semana e guarde o arquivo no Drive ou no WhatsApp. Versão do app: ${APP_BUILD}.`;
}
async function pwaExport(data){
  const name = `ciclo-de-ferro-${todayKey()}.json`;
  const done = () => { S.lastBackup = Date.now(); touchSettings(); toast("Backup pronto"); render(); };
  try {
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Backup Ciclo de Ferro"});
      done(); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  done();
}
setSync("", "no celular");

loadLocal();
render();
initCloud();
</script>
