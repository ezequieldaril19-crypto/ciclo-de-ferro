      if (editing.fb != null) $("#cfb").value = fmt1(editing.fb * x0); if (editing.na != null) $("#cna").value = r0(editing.na * x0);
    }
    let servingG = null;
    const pre = opts.pre;
    if (pre){
      if (pre.n) $("#cn").value = String(pre.n).slice(0, 60);
      if (pre.b) $("#cbr").value = String(pre.b).slice(0, 40);
      if (pre.base) $("#cpor").value = fmt1(pre.base);
      [["ck","k"],["cp","p"],["cc","c"],["cf","f"],["cfb","fb"],["cna","na"]].forEach(([id,k]) => { if (pre[k] != null) $("#"+id).value = fmt1(pre[k]); });
      servingG = pre.por || null;
      $("#ocrMsg").textContent = pre.k != null

          if (!$("#ocrMsg")) return;
          const v = k => { const n = num(r && r[k]); return n != null && n >= 0 ? n : null; };
          if (!r || r.legivel === false || v("kcal") == null && v("proteina") == null){ msg.textContent = "Não deu para ler a tabela. Tente outra foto, reta e sem reflexo, ou digite os valores."; msg.className = "note warn"; }
          else {
            if (r.nome && !$("#cn").value.trim()) $("#cn").value = String(r.nome).slice(0, 60);
            if (r.marca && !$("#cbr").value.trim()) $("#cbr").value = String(r.marca).slice(0, 40);
            if (v("base_g")) $("#cpor").value = fmt1(v("base_g"));
            [["ck","kcal"],["cp","proteina"],["cc","carboidrato"],["cf","gordura"],["cfb","fibra"],["cna","sodio_mg"]].forEach(([id,k]) => { if (v(k) != null) $("#"+id).value = fmt1(v(k)); });
            servingG = v("porcao_g");
            msg.textContent = `Valores preenchidos (base de ${fmt1(v("base_g") || 100)} g${servingG ? `; porção do rótulo ${fmt1(servingG)} g` : ""}). Confira com a embalagem e salve.`; msg.className = "note";
          }
        }catch(err){
          if (!$("#ocrMsg")) return;
          if (err && err.code === "declined"){ msg.textContent = "Tudo bem. Digite os valores da embalagem."; msg.className = "note"; return; }
          const m = {not_granted:"Leitura por foto não autorizada. Digite os valores.", rate_limited:"A IA grátis está no limite agora. Espere 1 minuto ou digite os valores.", image_rejected:"Essa imagem não pôde ser usada. Tente outra foto.", appcheck:"A IA não reconheceu este aparelho. Atualize o app e tente de novo.", offline:"Sem internet agora. Digite os valores."}[err && err.code];
          msg.textContent = m || "A leitura falhou. Tente de novo ou digite os valores."; msg.className = "note warn";
          if (err && (err.code === "not_granted" || err.code === "sampling_disabled" || err.code === "images_unavailable")) $("#ocrBox label").hidden = true;
        }finally{ lbl.style.opacity = ""; e.target.value = ""; }
      };
    });
    $("#csave").onclick = () => {
      const n = $("#cn").value.trim(), por = num($("#cpor").value), p = num($("#cp").value)||0, c = num($("#cc").value)||0, f = num($("#cf").value)||0;
      let kc = num($("#ck").value);
      if (!n || !por){ toast("Preencha o nome e a porção"); return; }
      if (kc == null) kc = 4*p + 4*c + 9*f;
      const x = 100/por;
      if (!takeMeas()) return;
      const item = editing || {id:uid()};
      const b = $("#cbr").value.trim();
      Object.assign(item, {n, k:r1(kc*x), p:r1(p*x), c:r1(c*x), f:r1(f*x)});
      const fbv = num($("#cfb").value), nav = num($("#cna").value);
      if (fbv != null && fbv >= 0) item.fb = r1(fbv*x); else delete item.fb;
      if (nav != null && nav >= 0) item.na = Math.round(nav*x); else delete item.na;
      if (b) item.b = b; else delete item.b;
      if (bc){ S.custom.filter(cu => cu.bc === bc).forEach(cu => markGone(cu.id)); S.custom = S.custom.filter(cu => cu.bc !== bc); item.bc = bc; }
      delete item.por;
      if (servingG) item.por = r1(servingG);
      else if (Math.abs(por - 100) > 0.01) item.por = r1(por);
      const key = "c" + item.id;
      if (meas.length) S.units[key] = meas; else delete S.units[key];
      if (!editing) S.custom.unshift(item);
      touchSettings();
      if (Community){ if (share) shareCustom(item).then(() => { if (ui.tab === "ajustes" && !$("#sheetRoot").innerHTML) render(); }); else if (item.sid || item.share) unshareCustom(item); }
      if (opts.fromSettings){ closeSheet(); render(); toast(editing ? "Alimento atualizado" : "Alimento cadastrado"); return; }
      food = findFood(key); grams = servingG || por; qtyView();
    };
  }
  if (editFood || newFood) customFoodView({editId: editFood, fromSettings: true});
  else if (edit && edit.key === "q") quickView(edit);
  else if (edit || start) qtyView(); else searchView();
}

/* ================= Ferramentas de treino ================= */
const e1rm = (kg, r) => kg && r ? (r === 1 ? kg : kg * (1 + Math.min(r, 15)/30)) : 0;
const round25 = x => Math.round(x / 2.5) * 2.5;
const workSets = e => e.sets.filter(s => !s.w);
function exE1rm(e){ let best = 0; workSets(e).forEach(s => { best = Math.max(best, e1rm(num(s.kg) || 0, num(s.r) || 0)); }); return best; }
function plates(target, bar){
  const per = (target - bar) / 2, list = [25, 20, 15, 10, 5, 2.5, 1.25], out = [];
  if (per < 0) return null;
  let left = Math.round(per * 100) / 100;
  list.forEach(pl => { while (left >= pl - 1e-9){ out.push(pl); left = Math.round((left - pl) * 100) / 100; } });
  return {per, out, left};
}
// Timer de descanso: barra fixa acima das abas; vibra e apita no fim
let restT = null, restIv = null;
function beep(){
  try{
    const A = window.AudioContext || window.webkitAudioContext, ac = new A();
    [0, .25].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.25, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .2); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .22); });
  }catch(e){}
}
function startRest(sec){
  restT = {end: Date.now() + sec*1000, total: sec};
  clearInterval(restIv); restIv = setInterval(drawRest, 250); drawRest();
}
function stopRest(){ restT = null; clearInterval(restIv); const b = $("#restBar"); if (b) b.remove(); }
function drawRest(){
  if (!restT) return stopRest();
  let b = $("#restBar");
  if (!b){
    b = document.createElement("div"); b.id = "restBar"; b.className = "restbar"; b.setAttribute("role", "timer");
    b.innerHTML = `<div class="rfill"></div><span class="rt num"></span><button data-rs="-15" aria-label="Menos 15 segundos">−15</button><button data-rs="15" aria-label="Mais 15 segundos">+15</button><button data-rs="x">Pular</button>`;
    document.body.appendChild(b);
    b.querySelectorAll("[data-rs]").forEach(x => x.onclick = () => {
      if (x.dataset.rs === "x") return stopRest();
      restT.end += +x.dataset.rs * 1000; restT.total = Math.max(5, restT.total + +x.dataset.rs); drawRest();
    });
  }
  const left = Math.max(0, Math.ceil((restT.end - Date.now()) / 1000));
  b.querySelector(".rt").textContent = `Descanso ${Math.floor(left/60)}:${pad(left % 60)}`;
  b.querySelector(".rfill").style.width = `${Math.min(100, (1 - left/restT.total) * 100)}%`;
  if (left <= 0){ stopRest(); try{ navigator.vibrate && navigator.vibrate([300, 150, 300]); }catch(e){} beep(); toast("Descanso acabou: bora pra próxima série!"); }
}
function openToolsSheet(prefKg){
  const rests = [45, 60, 90, 120, 180, 240];
  const restLabel = r => r < 60 ? `${r} s` : r % 60 ? `${Math.floor(r/60)}:30 min` : `${r/60} min`;
  openSheet(`${sheetHead("Ferramentas")}
    <div class="label">Descanso entre séries</div>
    <div class="chips">${rests.map(r => `<button class="chip" data-rt="${r}" aria-pressed="${S.rest === r}">${restLabel(r)}</button>`).join("")}</div>
    <button class="chip share-tg" id="autoRest" aria-pressed="${S.autoRest}">${S.autoRest ? "✓ Começar o timer ao marcar uma série" : "Timer só quando eu pedir"}</button>

async function packLink(kind, obj){
  let bytes = new TextEncoder().encode(JSON.stringify(obj)), z = "0";
  try{ if (window.CompressionStream){ const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw")); bytes = new Uint8Array(await new Response(st).arrayBuffer()); z = "1"; } }catch(e){}
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return `${APP_URL}#${kind}=${z}${btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "")}`;
}
async function unpackLink(v){
  const z = v[0], b64 = v.slice(1).replace(/-/g, "+").replace(/_/g, "/");
  let bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
  if (z === "1"){ const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); bytes = new Uint8Array(await new Response(st).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}

function progressionHint(ex, k){
  const last = lastPerf(ex.n, k);
  if (!last) return "Primeira vez: comece leve e anote a carga.";
  const top = topReps(ex.reps);
  const ls = workSets(last.e).filter(s => s.kg || s.r);
  const best = Math.max(...ls.map(s => num(s.kg) || 0));
  const allHit = top && ls.length && ls.every(s => (num(s.r)||0) >= top);
  const summary = ls.map(s => `${s.kg ? String(s.kg).replace(".", ",") : "–"}×${s.r||"–"}`).join(", ");
  if (allHit && best) return `${shortDate(last.k)}: ${esc(summary)}. <b>Bateu todas as reps: suba para ${fmt1(best + (isLegs(ex.n) ? 5 : 2.5))} kg.</b>`;
  return `${shortDate(last.k)}: ${esc(summary)}. Mantenha a carga até completar todas as séries.`;
}
/* ---- Calendário de treinos e progressão de carga ---- */
const fmtKg = n => (Math.round((n||0)*100)/100).toLocaleString("pt-BR",{maximumFractionDigits:2});
const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function addMonths(mk, n){ const [y, m] = mk.split("-").map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function bestOf(e){
  // melhor carga da sessão; sem carga (peso do corpo), usa as repetições
  let kg = 0, reps = 0;
  workSets(e).forEach(s => { const w = num(s.kg) || 0, r = num(s.r) || 0; if (w && (r || s.ok)) kg = Math.max(kg, w); if (r) reps = Math.max(reps, r); });
  return {kg, reps};
}

function calendarHTML(k){

function sparkSVG(vals){
  if (vals.length < 2) return `<svg class="spark" viewBox="0 0 72 24" aria-hidden="true"><circle cx="66" cy="12" r="3" fill="var(--blue-hot)"/></svg>`;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => [4 + i*(64/(vals.length-1)), 20 - (v - lo)/span*16]);
  return `<svg class="spark" viewBox="0 0 72 24" aria-hidden="true"><polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="var(--blue-hot)"/></svg>`;
}
function progressionHTML(k){
  const mk = ui.calMonth || monthOf(k), [y, m] = mk.split("-").map(Number);
  const done = allWorkouts().filter(x => x.wo.done);
  const upTo = done.filter(x => monthOf(x.k) <= mk);
  const per = {};
  upTo.forEach(x => x.wo.ex.forEach(e => {
    const b = bestOf(e); if (!b.kg && !b.reps) return;
    (per[e.n] = per[e.n] || []).push({k:x.k, ...b});
  }));
  const rows = Object.entries(per).map(([n, list]) => {
    const month = list.filter(p => monthOf(p.k) === mk);
    if (!month.length) return null;
    const useKg = list.some(p => p.kg);
    const v = p => useKg ? p.kg : p.reps;
    const before = list.filter(p => monthOf(p.k) < mk && (!useKg || p.kg)).pop();
    const mv = month.filter(p => !useKg || p.kg);
    if (!mv.length) return null;
    const base = mv.length > 1 ? mv[0] : before;
    const cur = mv[mv.length-1];
    const delta = base ? v(cur) - v(base) : null;
    const series = list.filter(p => !useKg || p.kg).slice(-8).map(v);
    return {n, count: month.length, unit: useKg ? "kg" : "reps", base: base ? v(base) : null, cur: v(cur), delta, series, ref: mv.length > 1 ? "" : (before ? "vs. treino anterior" : "")};
  }).filter(Boolean).sort((a, b) => b.count - a.count || a.n.localeCompare(b.n));
  const body = rows.length ? `<ul class="prog-list">${rows.map(r => {
      const dl = r.delta === null ? `<span class="muted">1º registro</span>` : r.delta > 0 ? `<b class="up">+${fmtKg(r.delta)}</b>` : r.delta < 0 ? `<b class="down">${fmtKg(r.delta)}</b>` : `<span class="muted">mantida</span>`;
      return `<li><button data-pex="${esc(r.n)}"><span class="pr-n">${esc(r.n)}<small>${r.count} ${r.count === 1 ? "treino" : "treinos"} no mês${r.ref ? " · " + r.ref : ""}</small></span>${sparkSVG(r.series)}<span class="pr-v num">${r.base !== null && r.delta !== null ? `${fmtKg(r.base)} → ` : ""}${fmtKg(r.cur)} ${r.unit}${dl}</span></button></li>`;
    }).join("")}</ul><p class="note" style="margin:8px 0 0">Melhor carga de cada treino (ou repetições, em exercícios com o peso do corpo). Toque num exercício para ver o gráfico completo.</p>`
    : `<p class="note" style="margin:0">Nenhum treino finalizado em ${MONTHS[m-1]}. Finalize um treino com as cargas anotadas para acompanhar a progressão aqui.</p>`;
  return secH("Progressão de carga", `${MONTHS[m-1]}`, false) + `<section class="panel">${body}</section>`;
}

/* ================= Cartão do treino (para Stories, Feed e Direct) ================= */
function woStart(wo){
  // começa ao tocar em "Começar"; se a primeira série veio bem depois, conta a partir dela
  if (!wo.t0) return null;
  return wo.ta && wo.ta - wo.t0 > 20*60000 ? wo.ta - 3*60000 : wo.t0;
}
function woDuration(k, wo){
  if (wo.dur > 0) return wo.dur;
  const st = woStart(wo);
  if (!st || !wo.t1 || keyOf(new Date(st)) !== k) return null;
  const m = Math.round((wo.t1 - st) / 60000);
  return m >= 5 && m <= 300 ? m : null;
}
function workoutStats(k, wo){
  const prev = allWorkouts().filter(x => x.wo.done && x.k < k);
  let vol = 0, sets = 0, reps = 0;
  const ex = wo.ex.map(e => {
    let ev = 0, es = 0, er = 0, best = null, topR = 0;
    e.sets.forEach(s => {
      const w = num(s.kg) || 0, r = num(s.r) || 0;
      if (!(r || s.ok) || s.w) return;
      es++; er += r; ev += w*r; topR = Math.max(topR, r);
      if (w && (!best || w > best.kg || (w === best.kg && r > best.r))) best = {kg:w, r};
    });
    let prevBest = 0;
    prev.forEach(x => x.wo.ex.forEach(pe => { if (pe.n === e.n) prevBest = Math.max(prevBest, bestOf(pe).kg); }));
    const pr = best && prevBest > 0 && best.kg > prevBest ? best.kg - prevBest : 0;
    vol += ev; sets += es; reps += er;
    return {n:e.n, es, er, best, topR, pr};
  }).filter(x => x.es);
  const d0 = dateOf(k), wk = Array.from({length:7}, (_, i) => addDays(k, i - d0.getDay()));
  const doneKeys = new Set(allWorkouts().filter(x => x.wo.done || x.k === k).map(x => x.k));
  const week = wk.map(key => ({key, on: doneKeys.has(key), cur: key === k}));
  const weekN = wk.filter(key => key <= k && doneKeys.has(key)).length;
  const totalN = allWorkouts().filter(x => (x.wo.done || x.k === k) && x.k <= k).length;
  return {k, name: wo.name, label: woLabel(wo), ex, vol, sets, reps, prs: ex.filter(x => x.pr).length, dur: woDuration(k, wo), week, weekN, totalN};
}
let cardFontsP = null;
function cardFonts(){
  if (!cardFontsP) cardFontsP = Promise.all(['400 100px "Anton"', '400 60px "Permanent Marker"', '700 40px "Barlow Semi Condensed"', '600 40px "Barlow Semi Condensed"', '500 40px "Barlow Semi Condensed"']
    .map(f => document.fonts.load(f).catch(() => null))).then(() => document.fonts.ready).catch(() => null);
  return cardFontsP;
}
function seeded(str){
  let h = 1779033703; for (const ch of String(str)) h = Math.imul(h ^ ch.charCodeAt(0), 3432918353), h = h << 13 | h >>> 19;
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
const CARD = {void:"#050507", panel:"#0e0e13", panel2:"#15151c", ink:"#f1efe9", muted:"#9a98a3", blue:"#1f8bff", blueHot:"#74c6ff", red:"#e3172c", redHot:"#ff5263"};
function roughPoly(ctx, x, y, w, h, rnd, j){
  // retângulo com bordas rasgadas, como os painéis do app
  const pts = [], n = Math.max(6, Math.round(w / 46)), m = Math.max(3, Math.round(h / 60));
  for (let i = 0; i <= n; i++) pts.push([x + w*i/n, y + rnd()*j]);
  for (let i = 1; i <= m; i++) pts.push([x + w - rnd()*j*.6, y + h*i/m]);
  for (let i = n; i >= 0; i--) pts.push([x + w*i/n, y + h - rnd()*j]);
  for (let i = m - 1; i > 0; i--) pts.push([x + rnd()*j*.6, y + h*i/m]);
  ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
}
function brush(ctx, x, y, w, h, color, rnd, skew = -0.03){
  ctx.save(); ctx.translate(x, y); ctx.rotate(skew); ctx.fillStyle = color;
  roughPoly(ctx, 0, 0, w, h, rnd, h*.35); ctx.fill(); ctx.restore();
}
function chroma(ctx, txt, x, y, off, ink = CARD.ink){
  ctx.fillStyle = CARD.red; ctx.fillText(txt, x - off, y);
  ctx.fillStyle = CARD.blue; ctx.fillText(txt, x + off, y);
  ctx.fillStyle = ink; ctx.fillText(txt, x, y);
}
function fitLines(ctx, text, maxW, sizes, maxLines, family){
  for (const s of sizes){
    ctx.font = `400 ${s}px ${family}`;
    const words = text.split(/\s+/), lines = [];
    let cur = "";
    for (const w of words){ const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; } }
    if (cur) lines.push(cur);
    if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) return {s, lines};
  }
  const s = sizes[sizes.length-1]; ctx.font = `400 ${s}px ${family}`;
  return {s, lines: [ellipsize(ctx, text, maxW)]};
}
function ellipsize(ctx, t, maxW){
  if (ctx.measureText(t).width <= maxW) return t;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
function cardStatList(st, o){

  if (o.showDur && st.dur) out.push(st.dur < 60 ? {l:"Tempo", v:String(st.dur), u:"min"} : {l:"Tempo", v:`${Math.floor(st.dur/60)}h${pad(st.dur % 60)}`, u:""});

  return out.slice(0, 4);
}
const exBest = x => x.best ? `${fmtKg(x.best.kg)} kg${x.best.r ? ` × ${x.best.r}` : ""}` : x.topR ? `${x.topR} reps` : `${x.es} ${x.es === 1 ? "série" : "séries"}`;
const cardDate = k => { const d = dateOf(k); return `${WD[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`.toUpperCase(); };

      // respingos de tinta
      for (let i = 0; i < 26; i++){
        const red = rnd() < .55, side = rnd() < .5, x = side ? rnd()*(P - 24) : W - rnd()*(P - 24), y = rnd()*Hc, r = 2 + rnd()*rnd()*12;
        ctx.fillStyle = red ? "rgba(227,23,44,.55)" : "rgba(31,139,255,.5)";
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      // granulado
      const nz = document.createElement("canvas"); nz.width = nz.height = 160;
      const nc = nz.getContext("2d"), id = nc.createImageData(160, 160);
      for (let i = 0; i < id.data.length; i += 4){ const v = rnd()*255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 16; }
      nc.putImageData(id, 0, 0); ctx.fillStyle = ctx.createPattern(nz, "repeat"); ctx.fillRect(0, 0, W, Hc);
    }
  }
  ctx.textBaseline = "alphabetic";
  if (clear || photo){ ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 2; }

  // ---- cabeçalho: marca + data
  let y = clear ? 30 : story ? 90 : 70;
  ctx.save(); ctx.translate(P, y + 70); ctx.rotate(-0.035);
  ctx.font = `400 64px "Permanent Marker"`; chroma(ctx, "Muscle", 0, 0, 3);
  const mw = ctx.measureText("Muscle ").width;
  ctx.shadowColor = "transparent";
  brush(ctx, mw - 6, -58, ctx.measureText("Land").width + 26, 76, CARD.red, rnd, 0.03);
  ctx.fillStyle = CARD.ink; ctx.fillText("Land", mw + 6, 0);
  ctx.restore();
  if (clear || photo){ ctx.shadowColor = "rgba(0,0,0,.55)"; }
  ctx.font = `700 30px "Barlow Semi Condensed"`; ctx.letterSpacing = "3px"; ctx.textAlign = "right"; ctx.fillStyle = photo || clear ? CARD.ink : CARD.muted;
  ctx.fillText(cardDate(st.k), W - P, y + 62);
  ctx.textAlign = "left"; ctx.letterSpacing = "0px";

  // ---- bloco principal (foto: ancorado embaixo)
  const mainH = labelH + titleH + statsH + (photo ? weekH : 0);
  y = photo ? Hc - P - mainH + 10 : y + headH + (story && !clear ? 70 : 20);

  ctx.font = `700 32px "Barlow Semi Condensed"`; ctx.letterSpacing = "6px"; ctx.fillStyle = CARD.blueHot;
  ctx.fillText("TREINO CONCLUÍDO", P, y + 34);
  ctx.textAlign = "right"; ctx.fillStyle = photo || clear ? CARD.ink : CARD.muted; ctx.fillText(`Nº ${st.totalN}`, W - P, y + 34);
  ctx.textAlign = "left"; ctx.letterSpacing = "0px";
  y += labelH;

  // título com faixa de tinta vermelha atrás da última linha
  const lastW = (ctx.font = `400 ${title.s}px "Anton"`, ctx.measureText(title.lines[title.lines.length-1]).width);
  const shadowWas = ctx.shadowColor; ctx.shadowColor = "transparent";
  brush(ctx, P - 10, y + (title.lines.length - 1)*titleLH + title.s*.72, Math.min(W - 2*P + 20, lastW + 40), title.s*.26, CARD.red, rnd, -0.025);
  ctx.shadowColor = shadowWas;
  title.lines.forEach((l, i) => chroma(ctx, l, P, y + title.s*.9 + i*titleLH, 4));
  y += titleH;

  // números
  const panel = !clear && !photo;
  if (panel){ ctx.save(); ctx.shadowColor = "transparent"; const g = ctx.createLinearGradient(0, y, 0, y + statsH); g.addColorStop(0, CARD.panel2); g.addColorStop(1, CARD.panel); ctx.fillStyle = g; roughPoly(ctx, P - 30, y - 10, W - 2*P + 60, statsH, rnd, 10); ctx.fill(); ctx.restore(); }
  const cw = (W - 2*P) / cols;
  stats.forEach((s, i) => {
    const cx = P + (i % cols) * cw + (panel ? 10 : 0), cy = y + Math.floor(i / cols) * cellH + (panel ? 28 : 6);
    ctx.font = `700 ${cols === 4 ? 24 : 28}px "Barlow Semi Condensed"`; ctx.letterSpacing = "4px"; ctx.fillStyle = photo || clear ? CARD.ink : CARD.muted;
    ctx.fillText(s.l.toUpperCase(), cx, cy + 26); ctx.letterSpacing = "0px";
    // número diminui até caber na coluna (ex.: 12.450 kg em 4 colunas)
    const uSize = cols === 4 ? 30 : 40, maxW = cw - 26;
    ctx.font = `600 ${uSize}px "Barlow Semi Condensed"`; const uw = s.u ? ctx.measureText(s.u).width + 8 : 0;
    let vs = valSize; ctx.font = `400 ${vs}px "Anton"`;
    while (vs > 40 && ctx.measureText(s.v).width + uw > maxW){ vs -= 4; ctx.font = `400 ${vs}px "Anton"`; }
    ctx.fillStyle = s.hot ? CARD.redHot : CARD.ink;
    ctx.fillText(s.v, cx, cy + 34 + valSize*.95);
    if (s.u){ const vw = ctx.measureText(s.v).width; ctx.font = `600 ${uSize}px "Barlow Semi Condensed"`; ctx.fillStyle = photo || clear ? CARD.ink : CARD.muted; ctx.fillText(s.u, cx + vw + 8, cy + 34 + valSize*.95); }
  });
  y += statsH;

  // exercícios (estilo Muscle Land)
  const footY = Hc - P - weekH + 20;
  if (showEx){
    y += story ? 30 : 10;
    const rowH = story ? 96 : 84, avail = footY - y - 66;
    const n = Math.max(1, Math.floor(avail / rowH));
    const extra = st.ex.length > n ? st.ex.length - (n - 1) : 0;
    const list = extra ? st.ex.slice(0, n - 1) : st.ex.slice(0, n);
    ctx.font = `700 26px "Barlow Semi Condensed"`; ctx.letterSpacing = "5px"; ctx.fillStyle = CARD.muted;
    ctx.fillText("EXERCÍCIOS", P, y + 26); ctx.letterSpacing = "0px";
    y += 46;
    list.forEach(x => {
      ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.setLineDash([6, 8]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(P, y + 4); ctx.lineTo(W - P, y + 4); ctx.stroke(); ctx.setLineDash([]);
      const right = exBest(x);
      ctx.font = `400 ${story ? 48 : 42}px "Anton"`; const rw = ctx.measureText(right).width;
      ctx.fillStyle = CARD.ink; ctx.textAlign = "right"; ctx.fillText(right, W - P, y + (story ? 58 : 52)); ctx.textAlign = "left";
      ctx.font = `600 ${story ? 38 : 34}px "Barlow Semi Condensed"`; ctx.fillStyle = CARD.ink;
      const nameW = W - 2*P - rw - 30;
      ctx.fillText(ellipsize(ctx, x.n, nameW), P, y + (story ? 46 : 42));
      ctx.font = `500 ${story ? 27 : 25}px "Barlow Semi Condensed"`; ctx.fillStyle = CARD.muted;
      const sub = `${x.es} ${x.es === 1 ? "série" : "séries"}${x.er ? ` · ${x.er} reps` : ""}`;
      ctx.fillText(sub, P, y + (story ? 80 : 72));
      if (x.pr){
        const sw = ctx.measureText(sub).width, tag = `RECORDE +${fmtKg(x.pr)} KG`;
        ctx.font = `400 ${story ? 24 : 22}px "Anton"`; ctx.letterSpacing = "2px";
        const tw = ctx.measureText(tag).width;
        brush(ctx, P + sw + 16, y + (story ? 56 : 50), tw + 22, story ? 32 : 30, CARD.red, rnd, -0.02);
        ctx.fillStyle = CARD.ink; ctx.fillText(tag, P + sw + 27, y + (story ? 81 : 73)); ctx.letterSpacing = "0px";
      }
      y += rowH;
    });
    if (extra){ ctx.font = `600 32px "Barlow Semi Condensed"`; ctx.fillStyle = CARD.blueHot; ctx.fillText(`+ ${extra} ${extra === 1 ? "exercício" : "exercícios"}`, P, y + 44); }
  }

  // semana
  if (!clear){
    const wy = photo ? Hc - P - weekH + 30 : footY;
    const r = story ? 34 : 30, gap = story ? 86 : 78;
    ctx.font = `700 24px "Barlow Semi Condensed"`; ctx.letterSpacing = "5px"; ctx.fillStyle = photo ? CARD.ink : CARD.muted;
    ctx.fillText("SEMANA", P, wy + 10); ctx.letterSpacing = "0px";
    const letters = ["D","S","T","Q","Q","S","S"];
    st.week.forEach((d, i) => {
      const cx = P + r + i*gap, cy = wy + 34 + r;
      ctx.save(); ctx.shadowColor = "transparent";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
      if (d.on){ ctx.fillStyle = CARD.red; ctx.fill(); } else { ctx.fillStyle = "rgba(255,255,255,.07)"; ctx.fill(); }
      if (d.cur){ ctx.lineWidth = 5; ctx.strokeStyle = CARD.blueHot; ctx.stroke(); }
      ctx.restore();
      ctx.font = `700 ${story ? 28 : 25}px "Barlow Semi Condensed"`; ctx.textAlign = "center"; ctx.fillStyle = d.on ? CARD.ink : CARD.muted;
      ctx.fillText(letters[i], cx, cy + 10); ctx.textAlign = "left";
    });
    ctx.textAlign = "right";
    ctx.font = `400 ${story ? 60 : 52}px "Anton"`; ctx.fillStyle = CARD.ink; ctx.fillText(String(st.weekN), W - P, wy + 70);
    ctx.font = `600 26px "Barlow Semi Condensed"`; ctx.fillStyle = photo ? CARD.ink : CARD.muted; ctx.fillText(st.weekN === 1 ? "treino na semana" : "treinos na semana", W - P, wy + 106);
    ctx.textAlign = "left";
  }
  return cv;
}
function cardBlob(cv, png){ return new Promise(res => cv.toBlob(b => res(b), png ? "image/png" : "image/jpeg", .92)); }

function openWorkoutCard(k){
  const d = getDay(k, false), wo = d && d.wo; if (!wo) return;
  const o = {style:"ml", fmt:"story", img:null, showEx:true, showDur:true};
  let st = workoutStats(k, wo), blob = null, url = null, busy = 0;
  openSheet(`${sheetHead("Compartilhar treino")}
    <div class="card-wrap" id="cardWrap"><img id="cardImg" class="card-prev" alt="Prévia do cartão do treino"><p class="note" id="cardWait" style="margin:0">Montando o cartão…</p></div>
    <div class="seg modes" role="group" aria-label="Estilo">${[["ml","Muscle Land"],["photo","Sua foto"],["clear","Transparente"]].map(([v,l]) => `<button data-cst="${v}">${l}</button>`).join("")}</div>
    <div class="seg modes" role="group" aria-label="Formato" id="cardFmt">${[["story","Stories 9:16"],["feed","Feed 4:5"]].map(([v,l]) => `<button data-cfm="${v}">${l}</button>`).join("")}</div>
    <label class="btn blue wide" id="cardPhotoBtn" style="text-align:center;cursor:pointer" hidden>Escolher foto<input id="cardPhoto" type="file" accept="image/*" hidden></label>
    <p class="note" id="cardHint" style="margin:0"></p>
    <div class="grid2">
      <div class="field"><label for="cardDur">Duração (min)</label><input id="cardDur" type="text" inputmode="numeric" placeholder="Ex.: 60" value="${st.dur || ""}"></div>
      <div class="field"><label>&nbsp;</label><button class="chip" id="cardEx" aria-pressed="true" style="height:46px">Lista de exercícios</button></div>
    </div>
    <button class="btn wide" id="cardShare">Compartilhar</button>
    <button class="btn ghost wide" id="cardSave">Salvar imagem</button>`);
  const img = $("#cardImg");
  const sync = () => {
    document.querySelectorAll("[data-cst]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cst === o.style)));
    document.querySelectorAll("[data-cfm]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cfm === o.fmt)));
    $("#cardFmt").hidden = o.style === "clear";
    $("#cardPhotoBtn").hidden = o.style !== "photo";
    $("#cardPhotoBtn").firstChild.textContent = o.img ? "Trocar foto" : "Escolher foto";
    $("#cardEx").hidden = o.style !== "ml"; $("#cardEx").setAttribute("aria-pressed", String(o.showEx)); $("#cardEx").textContent = o.showEx ? "✓ Com exercícios" : "Sem exercícios";
    $("#cardHint").textContent = o.style === "clear" ? "Fundo transparente, para colocar por cima de uma foto sua." : o.style === "photo" ? (o.img ? "A foto fica só no seu celular; o app não guarda nem envia." : "Escolha uma foto do treino. Os números entram por cima dela.") : "No Instagram, escolha Stories, Feed ou Direct.";
    img.classList.toggle("clear", o.style === "clear");
  };
  const draw = async () => {
    const my = ++busy;
    const cv = await drawWorkoutCard(st, {...o, img: o.style === "photo" ? o.img : null, style: o.style === "photo" && !o.img ? "ml" : o.style});
    const b = await cardBlob(cv, o.style === "clear");
    if (my !== busy || !$("#cardImg")) return;
    blob = b; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(b); img.src = url;
    $("#cardWait").hidden = true;
  };
  const fname = () => `treino-muscle-land-${k}.${o.style === "clear" ? "png" : "jpg"}`;
  document.querySelectorAll("[data-cst]").forEach(b => b.onclick = () => { o.style = b.dataset.cst; sync(); draw(); if (o.style === "photo" && !o.img) $("#cardPhoto").click(); });
  document.querySelectorAll("[data-cfm]").forEach(b => b.onclick = () => { o.fmt = b.dataset.cfm; sync(); draw(); });
  $("#cardEx").onclick = () => { o.showEx = !o.showEx; sync(); draw(); };
  $("#cardPhoto").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{ o.img = await loadImg(f); }catch(_){ toast("Não consegui abrir essa foto"); return; }
    sync(); draw();
  };
  $("#cardDur").addEventListener("change", e => {
    const v = Math.round(num(e.target.value) || 0);
    if (v > 0 && v <= 600){ wo.dur = v; } else { delete wo.dur; e.target.value = ""; }
    touchDay(k); st = workoutStats(k, wo); draw();
  });
  const save = async () => {
    if (!blob) return;
    try{
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl){ await dl.save({filename:fname(), data:blob}); toast("Imagem salva"); return; }
    }catch(e){ if (e && e.code === "declined") return; }
    const a = document.createElement("a"), u = URL.createObjectURL(blob); a.href = u; a.download = fname(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000); toast("Imagem salva");
  };
  $("#cardSave").onclick = save;
  $("#cardShare").onclick = async () => {
    if (!blob) return;
    const file = new File([blob], fname(), {type: blob.type});
    try{
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:`${st.name} · Muscle Land`}); return; }
    }catch(e){ if (e && e.name === "AbortError") return; }
    toast("Aqui não dá para abrir o compartilhamento. Salve a imagem e poste pelo Instagram.");
    save();
  };
  sync(); draw();
}

/* ================= Corpo (percentual de gordura) ================= */
function scaleHTML(sex, bf){
  const b = BF_BANDS[sex], lo = b[0][0], hi = b[b.length-1][0];
  const pos = Math.max(0, Math.min(100, (bf - lo)/(hi - lo)*100));
  const segs = b.slice(0,-1).map((x,i) => `<span style="width:${(b[i+1][0]-x[0])/(hi-lo)*100}%;background:${x[2]}"></span>`).join("");
  return `<div class="scale"><div class="mark" style="left:${pos}%"></div><div class="segs">${segs}</div><div class="ticks num">${b.slice(0,-1).map(x => `<span>${x[0]}%</span>`).join("")}<span>${hi}%</span></div></div>
    <div class="legend">${b.slice(0,-1).map(x => `<span><i style="background:${x[2]}"></i>${x[1]}</span>`).join("")}</div>`;
}
function renderCorpo(){

    const first = hist[0], dLean = cur.lean - first.lean, dFat = cur.fat - first.fat;
    html += `<section class="panel ${cur.bf >= (fem ? 32 : 25) ? "red" : "blue"}" style="margin-top:12px">
      <div class="label">Percentual de gordura · ${cur.k === k ? "neste dia" : "medição de " + shortDate(cur.k)}</div>
      <div class="bf-big" style="margin-top:6px"><div class="v num">${fmt1(cur.bf)}<small>%</small></div><span class="tagc">${bfClass(S.sex, cur.bf)}</span></div>

    const rows = hist.slice(-8).reverse();
    html += secH("Histórico de medidas") + `<section class="panel" style="overflow-x:auto"><table class="mac"><thead><tr><th>Data</th><th>Peso</th><th>Cintura</th><th>%G</th><th>Magra</th></tr></thead><tbody>
      ${rows.map(h => `<tr><td>${shortDate(h.k)}</td><td>${fmt1(h.w)}</td><td>${fmt1(h.b.ci)}</td><td>${fmt1(h.bf)}%</td><td>${fmt1(h.lean)}</td></tr>`).join("")}</tbody></table></section>`;
  }
  view.innerHTML = html;
  bindDateBar();
  $("#bSave").onclick = () => {

    const bf = navyBF(S.sex, S.height, pe, ci, qu);

    const dd = getDay(k, true);
    if (w && w > 30 && w < 300) dd.w = r1(w);

    [["to","#bTo"],["br","#bBr"],["co","#bCo"],["pa","#bPa"]].forEach(([f,id]) => { const v = get(id); if (v) body[f] = r1(v); });
    dd.body = body;
    touchDay(k); render(); toast("Medidas salvas");

  const C = chartBase();
  if (C && $("#cBF")){
    charts.push(new C($("#cBF"), {type:"line", data:{labels:hist.map(h => shortDate(h.k)), datasets:[
      {label:"% gordura", data:hist.map(h => r1(h.bf)), borderColor:"#e3172c", backgroundColor:"#e3172c", borderWidth:3, pointRadius:4, tension:.25, yAxisID:"y"},
      {label:"Massa magra", data:hist.map(h => r1(h.lean)), borderColor:"#1f8bff", backgroundColor:"#1f8bff", borderWidth:3, pointRadius:4, tension:.25, yAxisID:"y1"}]},
      options:{maintainAspectRatio:false, interaction:{mode:"index", intersect:false}, plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false}}, y:{position:"left", grace:"15%", ticks:{callback:v => v + "%"}}, y1:{position:"right", grace:"10%", grid:{display:false}, ticks:{callback:v => v + " kg"}}}}}));

    if (!chartP) chartP = new Promise(res => { const sc = document.createElement("script"); sc.src = "vendor/chart.umd.js"; sc.onload = res; sc.onerror = () => { chartP = null; res(); }; document.head.appendChild(sc); })
      .then(() => { if (window.Chart && (ui.tab === "evolucao" || ui.tab === "corpo") && !$("#sheetRoot").innerHTML) render(); });
    return null;
  }
  Chart.defaults.color = "#8e8c96";
  Chart.defaults.borderColor = "#24242e";
  Chart.defaults.font.family = '"Barlow Semi Condensed", system-ui, sans-serif';
  Chart.defaults.font.size = 12;
  return Chart;
}
function renderEvolucao(){
  const today = todayKey(), span = ui.range;
  const keys = []; for (let i = Math.min(span, 90)-1; i >= 0; i--) keys.push(addDays(today, -i));
  const weights = []; eachDay((k, d) => { if (d.w) weights.push([k, d.w]); });
  const inRange = weights.filter(([k]) => span === 9999 || k >= addDays(today, -(span-1)));
  const first = weights[0], last = weights[weights.length-1];
  const avgAround = (k0, k1) => { const xs = weights.filter(([k]) => k >= k0 && k <= k1).map(x => x[1]); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
  const nowAvg = avgAround(addDays(today,-6), today), prevAvg = avgAround(addDays(today,-34), addDays(today,-28));
  const rate = nowAvg && prevAvg ? (nowAvg - prevAvg)/4 : null;
  const logged = keys.filter(k => dayTotals(k).kcal > 0 && k < today);
  const avgK = logged.length ? logged.reduce((a,k) => a + dayTotals(k).kcal, 0)/logged.length : null;
  const avgP = logged.length ? logged.reduce((a,k) => a + dayTotals(k).p, 0)/logged.length : null;
  const goodDays = logged.map(k => rankOf(dayTotals(k), dayTarget(k))).filter(r => r === "S" || r === "A").length;
  const lift = {};
  allWorkouts().filter(x => x.wo.done).forEach(x => x.wo.ex.forEach(e => {
    const best = exE1rm(e); // só séries de trabalho: aquecimento não conta
    if (best) (lift[e.n] = lift[e.n] || []).push([x.k, best]);
  }));
  const liftNames = Object.keys(lift).sort((a,b) => lift[b].length - lift[a].length);
  if (!ui.exPick || !lift[ui.exPick]) ui.exPick = liftNames[0] || null;

  let html = `<div class="row" style="margin-top:4px"><h2 class="sec grow" style="margin:6px 0"><span class="t">Evolução</span></h2>
    <div class="seg" role="group" aria-label="Período">${[[30,"30 d"],[90,"90 d"],[9999,"Tudo"]].map(([v,l]) => `<button data-r="${v}" aria-pressed="${ui.range===v}">${l}</button>`).join("")}</div></div>`;
  html += `<div class="stats" style="margin-top:8px">
    <div class="panel stat"><div class="label">Peso atual</div><div class="v num">${last ? fmt1(last[1]) : "–"}<small> kg</small></div></div>
    <div class="panel stat"><div class="label">Desde o 1º registro</div><div class="v num ${first && last && last[1] < first[1] ? "good" : ""}">${first && last ? (last[1]-first[1] > 0 ? "+" : "") + fmt1(last[1]-first[1]) : "–"}<small> kg</small></div></div>
    <div class="panel stat"><div class="label">Ritmo (4 semanas)</div><div class="v num">${rate != null ? (rate > 0 ? "+" : "") + fmt1(rate) : "–"}<small> kg/sem</small></div></div>
    <div class="panel stat"><div class="label">Dias rank A ou S</div><div class="v num">${logged.length ? goodDays : "–"}<small>${logged.length ? " de " + logged.length : ""}</small></div></div>
  </div>`;
  html += secH("Semana em números", "sem IA", true) + `<section class="panel">${weekReportHTML(today)}</section>`;
  {
    const est = adaptiveEstimate(addDays(today, 1)), wk = weekStart(today), used = S.tdeeHist[wk];
    html += secH("Gasto real", "TDEE adaptativo") + `<section class="panel">` + (est.value ? `
      <div class="hero" style="margin:0"><div><div class="kcal-big num">${est.value.toLocaleString("pt-BR")}<small> kcal/dia</small></div>
        <div class="kcal-sub">Pela fórmula seriam <b class="num">${est.formula.toLocaleString("pt-BR")}</b> kcal (${est.value >= est.formula ? "+" : ""}${(est.value - est.formula).toLocaleString("pt-BR")})</div></div></div>
      <table class="mac" style="margin-top:10px"><tbody>
        <tr><td>Consumo médio registrado</td><td>${r0(est.avg).toLocaleString("pt-BR")} kcal · ${est.days} dias</td></tr>
        <tr><td>Tendência do peso</td><td>${est.slope*7 > 0 ? "+" : ""}${fmt1(est.slope*7)} kg/semana · ${est.weighs} pesagens</td></tr>
        <tr><td>Confiança</td><td>${Math.round(est.conf*100)}%${est.conf < 1 ? " (mistura com a fórmula)" : ""}</td></tr>
        <tr><td>Usado na meta desta semana</td><td>${S.adaptive ? (used ? `${used.toLocaleString("pt-BR")} kcal` : "fórmula") : "desligado"}</td></tr></tbody></table>
      ${S.adaptive && used !== est.value ? `<button class="btn ghost wide" id="tdeeNow" style="margin-top:10px">Usar ${est.value.toLocaleString("pt-BR")} kcal já nesta semana</button>` : ""}`
      : `<p class="note" style="margin:0">O app descobre quanto você gasta de verdade comparando o que você come com o que a balança mostra. Faltam dados das últimas 4 semanas: <b style="color:var(--ink)">${Math.max(0, 10 - est.days)}</b> dias com as refeições registradas e <b style="color:var(--ink)">${Math.max(0, 5 - est.weighs)}</b> pesagens. Até lá, a meta usa a fórmula (${est.formula.toLocaleString("pt-BR")} kcal).</p>`)
      + `<p class="note" style="margin:8px 0 0">Funciona melhor quando você registra tudo, inclusive nos fins de semana. A meta é recalculada todo domingo${S.adaptive ? "" : "; ligue em Ajustes > Perfil para usar"}.</p></section>`;
  }
  {
    const wk = weekStart(today), c = S.aiWeek[wk];
    html += `<div id="aiWeekWrap" ${ui.aiAvail ? "" : "hidden"}>` + secH("Resumo da semana", "IA", true) + `<section class="panel">${c ? `<div class="ai-text">${esc(c.text).replace(/\n/g, "<br>")}</div>
      <p class="note" style="margin:8px 0 0">Gerado ${new Date(c.at).toLocaleString("pt-BR", {weekday:"short", hour:"2-digit", minute:"2-digit"})}. É uma leitura dos seus números, não orientação médica.</p>
      <button class="btn ghost wide" id="aiWeek" style="margin-top:8px">Gerar de novo</button>`
      : `<p class="note" style="margin:0">A IA lê seus números dos últimos 7 dias (calorias, proteína, peso, treinos) e diz o que foi bem e o que ajustar.</p><button class="btn blue wide" id="aiWeek" style="margin-top:10px">✨ Gerar resumo da semana</button>`}
      <p class="note" id="aiWeekMsg" style="margin:6px 0 0"></p></section></div>`;
  }
  html += socialHTML();
  html += secH("Peso", "média de 7 dias", true) + `<section class="panel">${inRange.length >= 2 ? `<div class="chartbox"><canvas id="cW" aria-label="Gráfico de peso"></canvas></div>` : `<p class="note" style="margin:0">Registre o peso em jejum na aba Dieta. Com dois registros o gráfico aparece aqui, com a linha de tendência de 7 dias.</p>`}</section>`;
  html += secH("Calorias", "consumo × meta") + `<section class="panel">${logged.length ? `<div class="chartbox"><canvas id="cK" aria-label="Gráfico de calorias"></canvas></div><p class="note" style="margin:8px 0 0">Média: <span class="num">${r0(avgK)} kcal</span> · proteína média <span class="num">${r0(avgP)} g</span>. Barras: vermelho carbo alto, branco médio, azul baixo. Traços: meta do dia.</p>` : `<p class="note" style="margin:0">Quando você registrar refeições, cada dia aparece aqui comparado à meta do ciclo.</p>`}</section>`;
  html += secH("Força", "1RM estimado", true) + `<section class="panel">${liftNames.length ? `<select id="exSel" aria-label="Exercício">${liftNames.map(n => `<option ${n===ui.exPick?"selected":""}>${esc(n)}</option>`).join("")}</select><div class="chartbox" style="margin-top:10px"><canvas id="cL" aria-label="Gráfico de força"></canvas></div><p class="note" style="margin:8px 0 0">Estimativa de Epley a partir da melhor série de cada treino.</p>` : `<p class="note" style="margin:0">Finalize treinos com carga e repetições anotadas para ver sua força subir aqui.</p>`}</section>`;
  view.innerHTML = html;
  view.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { ui.range = +b.dataset.r; render(); });
  aiEngine().then(e => { ui.aiAvail = !!e; const w = $("#aiWeekWrap"); if (w) w.hidden = !e; });
  bindSocial(); socialRefresh();
  $("#aiWeek")?.addEventListener("click", async () => {
    const b = $("#aiWeek"), msg = $("#aiWeekMsg"); b.disabled = true; b.textContent = "Escrevendo…"; msg.textContent = ""; msg.className = "note";
    try{
      const st = weekStats(today);
      if (!st.dias_registrados && !st.treinos_feitos){ throw Object.assign(new Error("vazio"), {code:"empty"}); }
      const text = String(await aiCall("text", aiWeekPrompt(st))).trim().slice(0, 1600);
      S.aiWeek = {[weekStart(today)]: {text, at:Date.now()}}; touchSettings(); render();
    }catch(e){
      if (!$("#aiWeek")) return; b.disabled = false; b.textContent = "✨ Gerar resumo da semana";
      if (e && e.code === "declined") return;
      msg.textContent = e && e.code === "empty" ? "Registre refeições ou treinos nesta semana para ter o que resumir." : aiErrMsg(e); msg.className = "note warn";
    }
  });
  $("#tdeeNow")?.addEventListener("click", () => { const e = adaptiveEstimate(addDays(today, 1)); if (e.value){ S.tdeeHist[weekStart(today)] = e.value; touchSettings(); render(); toast("Meta da semana atualizada"); } });
  $("#exSel")?.addEventListener("change", e => { ui.exPick = e.target.value; render(); });

  const C = chartBase(); if (!C) return;
  if ($("#cW")){
    const ma = inRange.map(([k]) => { const xs = weights.filter(([k2]) => k2 <= k && k2 >= addDays(k,-6)).map(x => x[1]); return r1(xs.reduce((a,b)=>a+b,0)/xs.length); });
    charts.push(new C($("#cW"), {type:"line", data:{labels:inRange.map(x => shortDate(x[0])), datasets:[
      {label:"Peso", data:inRange.map(x => x[1]), showLine:false, pointRadius:3, pointBackgroundColor:"#5a5964", pointBorderWidth:0},
      {label:"Média 7 d", data:ma, borderColor:"#1f8bff", borderWidth:3, pointRadius:0, tension:.3, fill:{target:"origin"}, backgroundColor:"rgba(31,139,255,.08)"}]},
      options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}, ticks:{maxTicksLimit:6}}, y:{grace:"5%", ticks:{callback:v => v + " kg"}}}}}));
  }
  if ($("#cK")){
    const ks = keys.slice(-30);
    charts.push(new C($("#cK"), {type:"bar", data:{labels:ks.map(shortDate), datasets:[
      {type:"line", label:"Meta", data:ks.map(k => dayTarget(k).kcal), showLine:false, pointStyle:"line", pointRadius:7, pointBorderWidth:2, borderColor:"#74c6ff"},
      {label:"Consumo", data:ks.map(k => r0(dayTotals(k).kcal) || null), backgroundColor:ks.map(k => ({A:"#e3172c", M:"#d9d6ce", B:"#1f8bff"})[dayType(k)]), borderRadius:0, barPercentage:.8}]},
      options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}, ticks:{maxTicksLimit:7}}, y:{beginAtZero:true}}}}));
  }
  if ($("#cL") && ui.exPick){
    const pts = lift[ui.exPick];
    charts.push(new C($("#cL"), {type:"line", data:{labels:pts.map(p => shortDate(p[0])), datasets:[{label:"1RM", data:pts.map(p => r1(p[1])), borderColor:"#e3172c", borderWidth:3, pointRadius:4, pointBackgroundColor:"#1f8bff", pointBorderWidth:0, tension:.25}]},
      options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grace:"10%", ticks:{callback:v => v + " kg"}}}}}));
  }
}

/* ================= Editor de metas: calorias e macros (no estilo do Macros) ================= */
function openGoals(){
  const today = todayKey(), w = latestWeight(today), auto = autoPlan(w, today), bm = Math.round(bmr(w));
  const MAC = [["p","Proteína"],["c","Carbo"],["f","Gordura"]], KPG = {p:4, c:4, f:9};
  const UNITS = [["pct","% das kcal"],["g","Gramas"],["gkg","g por kg"]], UT = {pct:"%", g:"g", gkg:"g/kg"};
  const RANGE = {pct:{p:[0,100,1], c:[0,100,1], f:[0,100,1]}, g:{p:[0,400,1], c:[0,900,1], f:[0,250,1]}, gkg:{p:[0,5,0.05], c:[0,12,0.05], f:[0,3,0.05]}};
  const PRESETS = [["Equilibrada",30,40,30],["Mais proteína",40,35,25],["Low carb",35,20,45],["Mais carbo",25,55,20]];
  const seed = unit => { const o = {same:false, unit}; ["A","M","B"].forEach(t => o[t] = goalFromGrams(auto[t], unit, w)); return o; };
  let D = S.cg ? JSON.parse(JSON.stringify(S.cg)) : seed("pct");
  let mode = S.goalMode === "custom" ? "custom" : "auto", tab = "A", week = S.week.slice();
  const tk = () => D.same ? "A" : tab, cur = () => D[tk()];
  const gramsOf = t => goalGrams(D[t], D.unit, w);
  const kcalOf = t => { const g = gramsOf(t); return Math.round(4*g.p + 4*g.c + 9*g.f); };
  const fmtV = v => D.unit === "gkg" ? (Math.round(v*100)/100).toLocaleString("pt-BR", {maximumFractionDigits:2}) : String(Math.round(v));
  const nDays = t => week.filter(x => x === t).length;

  openSheet(`${sheetHead("Calorias e macros")}
    <div class="seg modes" role="group" aria-label="Como definir as metas">${[["auto","Automática"],["custom","Personalizada"]].map(([v,l]) => `<button data-gmode="${v}" aria-pressed="${mode === v}">${l}</button>`).join("")}</div>
    <div id="gBody" class="stack"></div>
    <h4 class="glabel">Micronutrientes</h4>
    <div class="grid2">
      <div class="field"><label for="gFib">Fibra, meta (g/dia)</label><input id="gFib" type="text" inputmode="numeric" placeholder="Automática" value="${S.fibGoal || ""}"></div>
      <div class="field"><label for="gNa">Sódio, limite (mg/dia)</label><input id="gNa" type="text" inputmode="numeric" placeholder="2.000 (OMS)" value="${S.naMax || ""}"></div>
    </div>
    <p class="note" style="margin:0">Vazio usa o padrão: fibra de 14 g para cada 1.000 kcal e sódio até 2.000 mg.</p>
    <div class="row"><button class="btn grow" id="gSave">Salvar metas</button><button class="btn ghost" id="gCancel">Cancelar</button></div>`);

  function body(){
    const B = $("#gBody");
    if (mode === "auto"){
      B.innerHTML = `<p class="note" style="margin:0">O app calcula pelo seu perfil: gasto de <span class="num">${auto.tdee.toLocaleString("pt-BR")} kcal</span>, ${S.goal === "cut" ? `déficit de ${S.def}%` : S.goal === "bulk" ? "superávit de 10%" : "manutenção"}, proteína de ${fmt1(S.prot)} g por kg e o carbo mudando conforme o dia da semana.</p>
        <table class="mac"><thead><tr><th>Dia</th><th>Prot</th><th>Carbo</th><th>Gord</th><th>kcal</th></tr></thead><tbody>
        ${["A","M","B"].map(t => `<tr><td>${TYPE_NAME[t]}</td><td>${auto[t].p} g</td><td>${auto[t].c} g</td><td>${auto[t].f} g</td><td>${auto[t].kcal}</td></tr>`).join("")}</tbody></table>
        <p class="note" style="margin:0">Quer escolher você mesmo as calorias e a divisão entre proteína, carbo e gordura? Toque em <b>Personalizada</b>. Ela começa com estes mesmos números.</p>`;
      return;
    }
    const g = cur();
    B.innerHTML = `
      <div><div class="label" style="margin-bottom:6px">Metas</div>
        <div class="seg modes" role="group" aria-label="Metas por dia">${[[1,"Iguais todo dia"],[0,"Por tipo de dia"]].map(([v,l]) => `<button data-gsame="${v}" aria-pressed="${!!D.same === !!v}">${l}</button>`).join("")}</div></div>
      ${D.same ? "" : `<div class="gtabs" role="tablist" aria-label="Tipo de dia">${["A","M","B"].map(t => `<button class="${t}" role="tab" data-gtab="${t}" aria-selected="${tab === t}">${TYPE_NAME[t]}<small id="gtk-${t}"></small></button>`).join("")}</div>
        <div><div class="label" style="margin-bottom:6px">Semana (toque para trocar)</div>
        <div class="week">${week.map((t,i) => `<button class="${t}" data-gwd="${i}" aria-label="${WD[i]}: ${TYPE_NAME[t]}">${WD[i]}<b>${t === "A" ? "ALTO" : t === "M" ? "MÉD" : "BAIXO"}</b></button>`).join("")}</div>
        <p class="note num" id="gAvg" style="margin:6px 0 0"></p></div>`}
      <div><div class="label" style="margin-bottom:6px">Definir em</div>
        <div class="seg modes" role="group" aria-label="Unidade">${UNITS.map(([v,l]) => `<button data-gunit="${v}" aria-pressed="${D.unit === v}">${l}</button>`).join("")}</div></div>
      <div class="gkcal">${D.unit === "pct"
        ? `<button class="mini" data-kst="-50" aria-label="Menos 50 kcal">−</button><input id="gK" class="num" type="text" inputmode="numeric" value="${g.k}" aria-label="Calorias do dia"><span>kcal</span><button class="mini" data-kst="50" aria-label="Mais 50 kcal">+</button>`
        : `<b class="num" id="gKv"></b><span>kcal</span>`}</div>
      <p class="note" style="margin:-6px 0 0;text-align:center">${D.unit === "pct" ? "Escolha as calorias e quanto delas vem de cada macro. A soma fica sempre em 100%." : "Calorias calculadas pelos macros: 4 kcal por grama de proteína e de carbo, 9 por grama de gordura."}</p>
      <div class="gbar" aria-hidden="true"><i class="p"></i><i class="c"></i><i class="f"></i></div>
      ${MAC.map(([m, l]) => { const [mn, mx, st] = RANGE[D.unit][m]; return `<div class="gm ${m}">
        <div class="gm-h"><label class="gm-n" for="gv-${m}">${l}</label><span class="gm-alt num" id="ga-${m}"></span><input class="gm-v num" id="gv-${m}" data-gv="${m}" type="text" inputmode="decimal" value="${fmtV(g[m])}"><span class="gm-u">${UT[D.unit]}</span></div>
        <input type="range" id="gr-${m}" data-gr="${m}" min="${mn}" max="${Math.max(mx, g[m])}" step="${st}" value="${g[m]}" aria-label="${l}">
      </div>`; }).join("")}
      <div><div class="label" style="margin-bottom:6px">Atalhos de divisão</div>
        <div class="chips">${PRESETS.map(([n, p, c, f], i) => `<button class="chip" data-gpre="${i}">${n} <span class="muted num">${p}/${c}/${f}</span></button>`).join("")}</div></div>
      <div id="gWarn" class="stack" style="gap:6px"></div>`;
    bindBody(); refresh();
  }
  function refresh(skip){
    if (mode !== "custom") return;
    const g = cur(), gr = gramsOf(tk()), k = 4*gr.p + 4*gr.c + 9*gr.f || 1;
    MAC.forEach(([m]) => {
      const v = $("#gv-" + m), r = $("#gr-" + m), pc = Math.round(KPG[m]*gr[m]/k*100);
      if (v && v !== skip) v.value = fmtV(g[m]);
      if (r && r !== skip){ if (g[m] > +r.max) r.max = g[m]; r.value = g[m]; }
      const parts = [];
      if (D.unit !== "g") parts.push(`${Math.round(gr[m])} g`);
      if (D.unit !== "gkg") parts.push(`${fmt1(gr[m]/w)} g/kg`);
      if (D.unit !== "pct") parts.push(`${pc}%`);
      $("#ga-" + m).textContent = parts.join(" · ");
      $(".gbar ." + m).style.width = (D.unit === "pct" ? g[m] : pc) + "%";
    });
    if ($("#gKv")) $("#gKv").textContent = Math.round(k).toLocaleString("pt-BR");
    if ($("#gK") && $("#gK") !== skip) $("#gK").value = g.k;
    ["A","M","B"].forEach(t => { const e = $("#gtk-" + t); if (e) e.textContent = `${kcalOf(t).toLocaleString("pt-BR")} kcal · ${nDays(t)} ${nDays(t) === 1 ? "dia" : "dias"}`; });
    if ($("#gAvg")) $("#gAvg").textContent = `Média da semana: ${Math.round(week.reduce((a, t) => a + kcalOf(t), 0)/7).toLocaleString("pt-BR")} kcal por dia.`;
    const pk = gr.p/w, fk = gr.f/w, warn = [];
    if (k < bm) warn.push(`Abaixo do seu metabolismo basal (${bm.toLocaleString("pt-BR")} kcal). Cortes muito agressivos tendem a custar massa muscular e rendimento.`);
    if (pk < 1.6) warn.push(`Proteína de ${fmt1(pk)} g por kg. Para quem treina, o usual fica entre 1,6 e 2,2 g por kg.`);
    if (fk < 0.5) warn.push(`Gordura de ${fmt1(fk)} g por kg. Abaixo de 0,5 g por kg pode atrapalhar a produção de hormônios.`);
    $("#gWarn").innerHTML = warn.map(x => `<p class="note warn" style="margin:0">${x}</p>`).join("");
  }
  function setMacro(m, v){
    const g = cur(); if (v == null || isNaN(v)) return;
    if (D.unit === "pct"){
      v = Math.max(0, Math.min(100, Math.round(v)));
      const partner = m === "c" ? "f" : "c", other = ["p","c","f"].find(x => x !== m && x !== partner);
      g[m] = v; let rest = 100 - v - g[other];
      if (rest < 0){ g[other] = Math.max(0, g[other] + rest); rest = 100 - v - g[other]; }
      g[partner] = Math.max(0, rest);
    } else g[m] = Math.max(0, D.unit === "gkg" ? Math.round(v*100)/100 : Math.round(v));
  }
  function setKcal(v){ if (v == null || isNaN(v)) return; cur().k = Math.max(800, Math.min(8000, Math.round(v))); }
  function bindBody(){
    $("#gBody").querySelectorAll("[data-gsame]").forEach(b => b.onclick = () => {
      const same = b.dataset.gsame === "1"; if (same === !!D.same) return;

    $("#gBody").querySelectorAll("[data-gtab]").forEach(b => b.onclick = () => { tab = b.dataset.gtab; body(); });
    $("#gBody").querySelectorAll("[data-gwd]").forEach(b => b.onclick = () => { const i = +b.dataset.gwd, o = ["A","M","B"]; week[i] = o[(o.indexOf(week[i]) + 1) % 3]; body(); });
    $("#gBody").querySelectorAll("[data-gunit]").forEach(b => b.onclick = () => {
      const u = b.dataset.gunit; if (u === D.unit) return;
      ["A","M","B"].forEach(t => { D[t] = goalFromGrams(goalGrams(D[t], D.unit, w), u, w); });
      D.unit = u; body();
    });
    $("#gBody").querySelectorAll("[data-kst]").forEach(b => b.onclick = () => { setKcal(cur().k + +b.dataset.kst); refresh(); });
    $("#gK")?.addEventListener("input", e => { const v = num(e.target.value.replace(/\./g, "")); if (v != null && v >= 800) { setKcal(v); refresh(e.target); } });
    $("#gK")?.addEventListener("change", e => { setKcal(num(e.target.value.replace(/\./g, "")) ?? cur().k); refresh(); });
    $("#gBody").querySelectorAll("[data-gr]").forEach(r => r.addEventListener("input", () => { setMacro(r.dataset.gr, +r.value); refresh(r); }));
    $("#gBody").querySelectorAll("[data-gv]").forEach(v => {
      v.addEventListener("input", () => { const n = num(v.value); if (n != null){ setMacro(v.dataset.gv, n); refresh(v); } });
      v.addEventListener("change", () => refresh());
    });
    $("#gBody").querySelectorAll("[data-gpre]").forEach(b => b.onclick = () => {
      const [name, P, C, F] = PRESETS[+b.dataset.gpre], k = kcalOf(tk());

  $("#sheetRoot").querySelectorAll("[data-gmode]").forEach(b => b.onclick = () => {

    S.goalMode = mode;
    if (mode === "custom"){ S.cg = D; S.week = week; }

    toast(mode === "custom" ? "Metas personalizadas salvas" : "Metas automáticas ligadas");

}

/* ================= Toast ================= */
let toastT;
function toast(msg, action){
  let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  if (action){
    el.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = msg; el.appendChild(sp);
    const b = document.createElement("button"); b.className = "toast-act"; b.textContent = action.label;
    b.onclick = () => { el.hidden = true; clearTimeout(toastT); action.fn(); };
    el.appendChild(b); el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 5000); return;
  }
  // um aviso simples (ex.: "compartilhado") não apaga um aviso com "Desfazer" que ainda está na tela: espera ele sumir
  if (!el.hidden && el.querySelector(".toast-act")){ clearTimeout(toastQ); toastQ = setTimeout(() => toast(msg), 1500); return; }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200);
}
let toastQ = null;

const Social = {profile:null, reqs:[], friends:[], at:0, busy:false};
function socialStats(){
  const today = todayKey(), mk = monthOf(today), ws = weekStart(today);
  const wos = allWorkouts().filter(x => x.wo.done);
  const month = wos.filter(x => monthOf(x.k) === mk), week = wos.filter(x => x.k >= ws && x.k <= today);
  const vol = month.reduce((a, x) => a + x.wo.ex.reduce((b, e) => b + workSets(e).reduce((c, s) => c + (num(s.kg) || 0)*(num(s.r) || 0), 0), 0), 0);
  let dd = 0; const [y, m] = mk.split("-").map(Number), days = new Date(y, m, 0).getDate();
  for (let i = 1; i <= days; i++){ const k = `${mk}-${pad(i)}`; if (k > today) break; if (dayTotals(k).kcal > 500) dd++; }
  const last = wos[wos.length - 1];
  return {n:(Social.profile && Social.profile.n) || "Atleta", mk, mo:month.length, wk:week.length, dd, vol:Math.round(vol), ln:last ? String(last.wo.name).slice(0, 40) : "", lk:last ? last.k : ""};
}
async function socialRefresh(force){
  if (!Account || !Account.user() || Social.busy) return;
  if (!force && Date.now() - Social.at < 5*60000) return;
  Social.busy = true;
  try{
    Social.profile = await Account.profile();
    await Account.publishStats(socialStats());
    [Social.reqs, Social.friends] = await Promise.all([Account.requests(), Account.friends()]);
    Social.at = Date.now();
    if (ui.tab === "evolucao" && !$("#sheetRoot").innerHTML) render();
  }catch(e){} finally{ Social.busy = false; }
}

      Cloud.col = Account.dataCol(); Cloud.ready = true; setSync("busy", "conectando");
      pull().then(() => socialRefresh(true));
    } else { Cloud.ready = false; Cloud.col = null; Social.profile = null; Social.friends = []; Social.reqs = []; setSync("", "no celular"); }
    if (!$("#sheetRoot").innerHTML) render();
  });
  if (Account.remembered()) setTimeout(() => Account.init().catch(() => {}), 600);
  setTimeout(checkRules, 2000); window.addEventListener("online", checkRules);
  let last = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Cloud.ready && Account.user() && Date.now() - last > 20000){ last = Date.now(); pull(); socialRefresh(); }
  });
}

/* ================= Lembretes ================= */
const REM_KINDS = [["peso","Pesar em jejum","07:00",true],["cafe","Registrar o café da manhã","09:30",false],["almoco","Registrar o almoço","13:30",true],["agua","Beber água","15:30",false],["treino","Hora do treino","18:00",false],["jantar","Registrar o jantar","20:30",true]];
function remState(){
  if (!S.rem) S.rem = {on:false, list:REM_KINDS.map(([k, , h, on]) => ({k, h, on}))};
  REM_KINDS.forEach(([k, , h]) => { if (!S.rem.list.some(x => x.k === k)) S.rem.list.push({k, h, on:false}); });
  return S.rem;
}
function remindersHTML(){
  if (!Reminders || (!rulesOk && !(S.rem && S.rem.on))) return "";
  const st = remState(), perm = Reminders.permission();
  return secH("Lembretes", st.on ? "ligados" : "") + `<section class="panel stack">
    ${perm === "unsupported" ? `<p class="note warn" style="margin:0">Este aparelho ou navegador não aceita notificações do app.</p>` : `
    <button class="chip share-tg" id="remOn" aria-pressed="${st.on}">${st.on ? "✓ Lembretes ligados" : "Ligar lembretes no celular"}</button>
    ${perm === "denied" ? `<p class="note warn" style="margin:0">As notificações do app estão bloqueadas. Libere nas configurações do Android: Apps > Muscle Land (ou Chrome) > Notificações.</p>` : ""}
    <ul class="list-edit rem-list">${st.list.map((r, i) => { const kd = REM_KINDS.find(x => x[0] === r.k); return `<li><button class="chip" data-rmt="${i}" aria-pressed="${r.on}">${r.on ? "✓" : "○"}</button><span>${esc(kd ? kd[1] : r.k)}</span><input type="time" data-rh="${i}" value="${esc(r.h)}" aria-label="Horário: ${esc(kd ? kd[1] : r.k)}"></li>`; }).join("")}</ul>
    <p class="note" style="margin:0">Os lembretes chegam com até uns 15 minutos de diferença do horário escolhido.</p>`}
  </section>`;
}
let remT = null;
async function remPush(ask){
  const st = remState(), list = st.list.filter(r => r.on && /^\d\d:\d\d$/.test(r.h)).map(r => ({k:r.k, h:r.h}));
  if (!st.on) return;
  if (!list.length){ await Reminders.off(); return; }
  await Reminders.save(list, ask);
}
function bindReminders(){
  if (!Reminders) return;
  const st = remState();
  const later = () => { clearTimeout(remT); remT = setTimeout(() => remPush(false).then(() => toast("Lembretes atualizados")).catch(e => toast(e && e.code === "denied" ? "Notificações bloqueadas no celular" : "Sem internet: tente de novo")), 900); };
  $("#remOn")?.addEventListener("click", async () => {
    const b = $("#remOn"); b.disabled = true;
    if (st.on){ st.on = false; touchSettings(); await Reminders.off(); render(); toast("Lembretes desligados"); return; }
    try{ st.on = true; await remPush(true); touchSettings(); render(); toast("Lembretes ligados"); }
    catch(e){ st.on = false; b.disabled = false; toast(e && e.code === "denied" ? "Sem permissão para notificar. Libere nas configurações" : e && e.code === "unsupported" ? "Este aparelho não aceita notificações do app" : "Não deu para ligar agora. Tente de novo"); render(); }
  });
  view.querySelectorAll("[data-rmt]").forEach(b => b.onclick = () => { const r = st.list[+b.dataset.rmt]; r.on = !r.on; touchSettings(); b.setAttribute("aria-pressed", String(r.on)); b.textContent = r.on ? "✓" : "○"; later(); });
  view.querySelectorAll("[data-rh]").forEach(inp => inp.onchange = () => { const r = st.list[+inp.dataset.rh]; if (/^\d\d:\d\d$/.test(inp.value)){ r.h = inp.value; touchSettings(); later(); } });
}

/* ===== Versão instalável: offline, instalação, backup em arquivo, atualização ===== */
const APP_BUILD = "15/10/2026 21:00";
if ("serviceWorker" in navigator){
  let hadController = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // procura versão nova sempre que o app volta para a tela
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController){ hadController = true; return; }
    showUpdateBar();
  });
}
function showUpdateBar(){
  if (document.getElementById("updBar")) return;
  const bar = document.createElement("div");
  bar.id = "updBar"; bar.setAttribute("role", "status");
  bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--blue);color:#02060f;font-weight:700;max-width:496px;margin:0 auto;clip-path:polygon(1% 0,100% 6%,99% 100%,0 92%)";
  bar.innerHTML = `<span style="flex:1">Nova versão do app pronta.</span><button style="background:#02060f;color:var(--ink);border:0;padding:8px 14px;font-family:var(--f-impact);letter-spacing:.06em;text-transform:uppercase">Atualizar</button>`;
  bar.querySelector("button").onclick = () => location.reload();
  document.body.appendChild(bar);
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (ui.tab === "ajustes") render(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("App instalado"); if (ui.tab === "ajustes") render(); });
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function hasData(){ return Object.keys(M).length > 0; }
function daysSinceBackup(){ return S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : null; }
// Instalação antiga (app "Ciclo de Ferro" ou outro pacote): nome e ícone ficam presos no app instalado
function oldAppBanner(){
  const ref = document.referrer || "", app = /^android-app:\/\/([^/]+)/.exec(ref);
  try{ if (app) sessionStorage.setItem("ml.pkg", app[1]); }catch(e){}
  let pkg = app ? app[1] : null; try{ pkg = pkg || sessionStorage.getItem("ml.pkg"); }catch(e){}
  if (!pkg || pkg === "io.github.ezequieldaril19.muscleland") return "";
  return `<section class="panel red" style="margin-bottom:12px"><p style="margin:0 0 8px;font-size:15px"><b>Você está na versão antiga do app.</b> Instale o Muscle Land para ter o nome e o ícone novos e os lembretes. Seus dados continuam.</p><a class="btn" href="baixar.html" style="display:block;text-align:center;text-decoration:none">Baixar o Muscle Land</a></section>`;
}
function backupBanner(){
  if (!hasData() || (typeof Cloud !== "undefined" && Cloud.ready)) return "";
  const d = daysSinceBackup();
  if (d !== null && d < 7) return "";
  return `<section class="panel blue" style="margin-bottom:12px"><div class="row"><p class="grow" style="margin:0;font-size:14px">${d === null ? "Você ainda não fez backup." : `Último backup há ${d} dias.`} Seus registros ficam só neste celular.</p><button class="add" id="bkNow">Fazer</button></div></section>`;
}
function pwaPanel(){
  if (isStandalone()) return "";
  let body;
  if (installEvt) body = `<p class="note" style="margin:0 0 10px">Instale para abrir em tela cheia, com ícone próprio e funcionando sem internet.</p><button class="btn wide" id="pwaInstall">Instalar o app</button>`;
  else if (isIOS()) body = `<p class="note" style="margin:0">No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>.</p>`;
  else body = `<p class="note" style="margin:0">No Chrome, abra o menu <b>⋮</b> e toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>`;
  return `<h2 class="sec b"><span class="t">Instalar no celular</span></h2><section class="panel">${body}</section>`;
}
function bindPwaPanel(){
  const b = document.getElementById("pwaInstall");
  if (b) b.onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); };
  const d = daysSinceBackup();
  const note = document.querySelector("#dataSec + section .note");
  if (note) note.textContent = `Seus registros ficam salvos só neste celular. ${d === null ? "Você ainda não fez nenhum backup." : `Último backup: há ${d} ${d === 1 ? "dia" : "dias"}.`} Exporte toda semana e guarde o arquivo no Drive ou no WhatsApp. Versão do app: ${APP_BUILD}.`;
}
async function pwaExport(data){
  const name = `muscle-land-${todayKey()}.json`;
  const done = () => { S.lastBackup = Date.now(); touchSettings(); toast("Backup pronto"); render(); };
  try {
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Backup Muscle Land"});
      done(); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  done();
}
